# tmux for the Deck's Claude console (own socket: -L deck).
#
# The point of tmux here is only that the session outlives the window: closing
# the console, locking the screen or restarting the desktop leaves Claude - and
# anything it is running in the background - untouched. Everything else about
# tmux should be invisible.

# ctrl+b is Claude's "run this in the background", and the console's menu sends
# it - so it must not be tmux's prefix.
unbind C-b
set -g prefix C-Space

# The buttons send ESC+<letter> for Claude's meta shortcuts. With any escape
# delay tmux reads those as a bare Escape followed by a letter.
set -sg escape-time 0

# No status bar: it would eat a row and show nothing worth a row.
set -g status off

# Mouse stays with the terminal, so VTE's own selection and touch scrolling
# keep working exactly as they do without tmux.
set -g mouse off

set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"      # Claude's palette is 24-bit
set -g allow-passthrough on             # let OSC sequences reach VTE
set -g set-clipboard on                 # OSC 52 copy from inside
set -g focus-events on

# Claude's TUI lives on the alternate screen, so scrollback here is unused.
set -g history-limit 2000

set -g destroy-unattached off           # survive a closed window
set -g detach-on-destroy on
